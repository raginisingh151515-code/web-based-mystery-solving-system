<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard | Noir Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="container">
      <div class="page-head">
        <h1>Leaderboard</h1>
        <p>The sharpest minds on the force, ranked by total score.</p>
      </div>
      <div class="profile-grid" id="profile"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th style="width:80px">Rank</th><th>Detective</th><th>Cases solved</th><th>Total score</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div style="margin:22px 0 40px;text-align:right">
        <button class="btn btn-danger btn-sm" id="resetBtn">Reset my progress</button>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
